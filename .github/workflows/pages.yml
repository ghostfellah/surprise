name: Publier les applications

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *" # instantané rafraîchi toutes les heures
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rafraîchir l'instantané (garde le dernier en cas d'échec)
        run: node scripts/snapshot.mjs || echo "API indisponible, instantané du dépôt conservé"
      - name: Rafraîchir les signaux de Sonar (garde les derniers en cas d'échec)
        run: node vigie/scripts/collect.mjs || echo "Sources indisponibles, relevé du dépôt conservé"
      - name: Rafraîchir Sat Radar (garde le dernier relevé en cas d'échec)
        run: node btc/scripts/collect.mjs || echo "Sources bitcoin indisponibles, relevé du dépôt conservé"
      - run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
